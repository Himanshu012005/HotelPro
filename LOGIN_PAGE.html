<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HotelPro | Sign In to Your Account</title>
  <meta name="description" content="Sign in to your HotelPro account to manage hotel reservations, access Genius discounts, and view travel vouchers.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary-navy: #003580;
      --primary-blue: #006ce4;
      --accent-yellow: #febb02;
      --bg-page: #f5f7fa;
      --bg-white: #ffffff;
      --border-light: #e0e6ed;
      --text-main: #1a1a1a;
      --text-muted: #595959;
      --radius-sm: 6px;
      --radius-md: 10px;
      --shadow-card: 0 4px 20px rgba(0,0,0,0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg-page);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Top Nav */
    .top-header {
      background: var(--primary-navy);
      color: #ffffff;
      padding: 14px 24px;
    }
    .header-inner {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .brand-logo {
      display: flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      cursor: pointer;
    }
    .brand-text {
      font-size: 22px;
      font-weight: 800;
      color: #ffffff;
    }
    .brand-text span {
      color: var(--accent-yellow);
    }
    .nav-links {
      display: flex;
      gap: 16px;
    }
    .nav-link {
      color: #ffffff;
      text-decoration: none;
      font-weight: 600;
      font-size: 13px;
    }
    .nav-link:hover {
      text-decoration: underline;
    }

    /* Main Login Container */
    .login-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    .login-card {
      background: #ffffff;
      border: 1px solid var(--border-light);
      border-radius: var(--radius-md);
      padding: 36px 32px;
      max-width: 440px;
      width: 100%;
      box-shadow: var(--shadow-card);
    }

    .login-title {
      font-size: 24px;
      font-weight: 800;
      color: var(--text-main);
      margin-bottom: 6px;
    }
    .login-sub {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 24px;
    }

    /* Quick 1-Click Evaluation Presets */
    .eval-box {
      background: #f8fafc;
      border: 1px solid var(--border-light);
      border-radius: var(--radius-sm);
      padding: 14px;
      margin-bottom: 20px;
    }
    .eval-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--primary-blue);
      margin-bottom: 8px;
    }
    .eval-btns {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }
    .btn-eval {
      background: #ffffff;
      border: 1px solid var(--border-light);
      padding: 8px 4px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 700;
      color: var(--text-main);
      cursor: pointer;
      text-align: center;
      transition: all 0.2s;
    }
    .btn-eval:hover {
      background: var(--primary-blue);
      color: #ffffff;
      border-color: var(--primary-blue);
    }

    /* Form Fields */
    .form-group {
      margin-bottom: 16px;
    }
    .form-label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 6px;
    }
    .form-input {
      width: 100%;
      border: 1px solid var(--border-light);
      border-radius: var(--radius-sm);
      padding: 10px 14px;
      font-size: 14px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s;
    }
    .form-input:focus {
      border-color: var(--primary-blue);
      box-shadow: 0 0 0 3px rgba(0, 108, 228, 0.12);
    }

    .form-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      font-size: 13px;
    }
    .form-check {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--text-muted);
      cursor: pointer;
    }

    .btn-submit {
      width: 100%;
      background: var(--primary-blue);
      color: #ffffff;
      font-weight: 700;
      font-size: 15px;
      padding: 12px;
      border: none;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-submit:hover {
      background: var(--primary-navy);
    }

    .login-footer {
      text-align: center;
      padding: 24px;
      font-size: 12px;
      color: var(--text-muted);
      border-top: 1px solid var(--border-light);
    }
  </style>
</head>
<body>

  <!-- Top Nav -->
  <header class="top-header">
    <div class="header-inner">
      <a href="index.html" class="brand-logo">
        <div class="brand-text">Hotel<span>Pro</span></div>
      </a>
      <div class="nav-links">
        <a href="index.html" class="nav-link">← Back to Stays</a>
        <a href="MY_BOOKINGS_PAGE.html" class="nav-link">My Bookings</a>
      </div>
    </div>
  </header>

  <!-- Login Form -->
  <main class="login-container">
    <div class="login-card">
      <h1 class="login-title">Sign in or create an account</h1>
      <p class="login-sub">Enter your email to access your bookings, Genius rewards, and preferences.</p>

      <!-- 1-Click Evaluation Presets -->
      <div class="eval-box">
        <div class="eval-label">⚡ 1-Click Quick Demo Login:</div>
        <div class="eval-btns">
          <button class="btn-eval" onclick="quickFill('himanshu.travel@gmail.com', 'traveler123', 'guest')">
            👤 Guest
          </button>
          <button class="btn-eval" onclick="quickFill('staff@hotelpro.com', 'staffpass123', 'staff')">
            🛠️ Staff
          </button>
          <button class="btn-eval" onclick="quickFill('admin@hotelpro.com', 'adminpass123', 'admin')">
            ⭐ Admin
          </button>
        </div>
      </div>

      <form id="login-form" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label class="form-label">Email Address</label>
          <input type="email" id="login-email" class="form-input" placeholder="e.g. yourname@example.com" value="himanshu.travel@gmail.com" required>
        </div>

        <div class="form-group">
          <label class="form-label">Password</label>
          <input type="password" id="login-pass" class="form-input" placeholder="••••••••••••" value="traveler123" required>
        </div>

        <div class="form-row">
          <label class="form-check">
            <input type="checkbox" checked>
            <span>Remember me</span>
          </label>
          <a href="#" style="color: var(--primary-blue); text-decoration: none;" onclick="alert('Password reset link sent to registered email.')">Forgot password?</a>
        </div>

        <button type="submit" class="btn-submit" id="btn-submit-text">
          Sign In
        </button>
      </form>
    </div>
  </main>

  <footer class="login-footer">
    HotelPro Hospitality Ltd. • All rights reserved • Safe & Secure 256-bit SSL Encryption
  </footer>

  <script>
    let currentRole = 'guest';

    function quickFill(email, pass, role) {
      document.getElementById('login-email').value = email;
      document.getElementById('login-pass').value = pass;
      currentRole = role;

      const btn = document.getElementById('btn-submit-text');
      btn.textContent = `Sign in as ${role.toUpperCase()}`;
    }

    function handleLogin(e) {
      e.preventDefault();
      const btn = document.getElementById('btn-submit-text');
      btn.textContent = 'Signing in...';

      setTimeout(() => {
        if (currentRole === 'guest') {
          window.location.href = 'MY_BOOKINGS_PAGE.html';
        } else {
          window.location.href = 'CYBERLODGE_SMART_HOTEL.html';
        }
      }, 500);
    }
  </script>
</body>
</html>
